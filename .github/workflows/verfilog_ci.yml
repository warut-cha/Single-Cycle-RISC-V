name: ASIC RTL Verification Flow

on:
  push:
  pull_request:

jobs:
  asic-flow:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repo
        uses: actions/checkout@v4

      - name: Install ASIC Tools & AI Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y iverilog verilator yosys python3 python3-pip

          # Optional: install Gemini SDK only if your AI agents use it
          pip install google-genai --break-system-packages

      - name: Run RTL Verification Flow
        run: |
          chmod +x scripts/generate_logs.sh
          bash scripts/generate_logs.sh

      - name: Run AI RTL Agents
        if: always()
        env:
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
        run: |
          if [ -f tools/ai_agent/run_agents.py ]; then
            if [ -n "$GOOGLE_API_KEY" ]; then
              echo "GOOGLE_API_KEY detected. Running Gemini-enabled agents."
              python3 tools/ai_agent/run_agents.py
            else
              echo "GOOGLE_API_KEY not found. Running rule-based fallback agents."
              DISABLE_GEMINI=1 python3 tools/ai_agent/run_agents.py
            fi
          else
            echo "AI agent script not found. Skipping AI agents."
          fi

      - name: Upload Reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rtl-verification-reports
          path: |
            reports/
            build/